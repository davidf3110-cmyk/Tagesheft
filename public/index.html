<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>James</title>
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="James">
<script>try{var t=localStorage.getItem("james-theme")||"dark";if(t!=="system")document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
</head><body>
<style>
/* Layout: eine schmale Spalte, unten eine feste Leiste mit sechs Bereichen (Heute, Training, Einkauf, Gebet, Geld, Jobs); oben Wochennavigation und Tagesleiste, darunter Karten */
:root{
  --bg:#F2F4F6;--card:#FFFFFF;--ink:#16222A;--mute:#5F6F7A;--line:#D9E0E6;--soft:#E8EDF1;--on:#FFFFFF;
  --gebet:#6F45A0;--bibel:#8A5A2B;--kirche:#2F5E9E;--spanisch:#B5382C;--python:#2C7A52;
  --gym:#3B4A8C;--swim:#12808A;--run:#A9650F;--rest:#6F7C86;--food:#2E7A55;
  --good:#2C7F45;--bad:#B0432C;--warn:#9A5B0C;
  --l-open:#9AA3AE;--l-no:#D2412F;--l-part:#C99300;--l-yes:#23A35E;--l-more:#2F7BE0;--glass:#DDE3E9;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181D;--card:#182228;--ink:#E7EDF1;--mute:#93A3AE;--line:#2A373F;--soft:#202C33;--on:#10181D;--gebet:#C3A4EC;--bibel:#DDAA70;--kirche:#8FB5EC;--spanisch:#F0897B;--python:#6CCB98;--gym:#93A0E8;--swim:#4FC3CC;--run:#ECAB52;--rest:#9AA7B0;--food:#67C99A;--good:#6CCB86;--bad:#F08A72;--warn:#ECAB52;--l-open:#B9C0CC;--l-no:#FF5B47;--l-part:#FFC531;--l-yes:#34D67D;--l-more:#4F9DFF;--glass:#232B32;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181D;--card:#182228;--ink:#E7EDF1;--mute:#93A3AE;--line:#2A373F;--soft:#202C33;--on:#10181D;--gebet:#C3A4EC;--bibel:#DDAA70;--kirche:#8FB5EC;--spanisch:#F0897B;--python:#6CCB98;--gym:#93A0E8;--swim:#4FC3CC;--run:#ECAB52;--rest:#9AA7B0;--food:#67C99A;--good:#6CCB86;--bad:#F08A72;--warn:#ECAB52;--l-open:#B9C0CC;--l-no:#FF5B47;--l-part:#FFC531;--l-yes:#34D67D;--l-more:#4F9DFF;--glass:#232B32;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-ui);font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
main{max-width:560px;margin:0 auto;padding-block:16px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
h1{font-size:26px;margin:4px 0 0;letter-spacing:-.02em}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--kirche);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0}
textarea{resize:vertical}
select{width:auto;min-height:40px}
.mute{color:var(--mute)}
.hint{margin:0;color:var(--mute);font-size:14px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.badge{font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--mute);color:var(--mute)}
.badge.gym{color:var(--gym);border-color:var(--gym)}.badge.swim{color:var(--swim);border-color:var(--swim)}.badge.run{color:var(--run);border-color:var(--run)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 10px}
.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.lnk{border:0;background:none;color:var(--mute);text-decoration:underline;min-height:32px;padding:2px 0;font-size:14px}
.ic{padding:0 12px}
.msg{margin:0;font-size:14px;color:var(--warn)}
.banner{margin:0;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.45;background:var(--card);border:1.5px solid var(--bad)}
.banner.wait{border-color:var(--line);color:var(--mute)}
.f{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:36px;padding:6px 12px;font-size:14px;border-radius:99px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sum{display:flex;flex-wrap:wrap;gap:6px}
.sum span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--mute)}
.sum b{color:var(--ink);font-weight:650}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:20px;letter-spacing:-.01em}
.stat small{color:var(--mute);font-size:12px}
.tw{overflow-x:auto}
table.ft{width:100%;border-collapse:collapse;font-size:14px}
.ft th{font-weight:600;color:var(--mute);font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ft td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ft th:first-child,.ft td:first-child{text-align:left}
.ft .full,.ft .good{color:var(--good);font-weight:650}.ft .bad{color:var(--bad)}
.ft .zero{color:var(--mute)}
.track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;background:var(--good);border-radius:99px}
.track i.warn{background:var(--warn)}.track i.over{background:var(--bad)}
.split{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mute);flex-wrap:wrap}
.split b{color:var(--ink);font-weight:650}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg2 button{border:0;background:transparent;min-height:36px;font-weight:600;color:var(--mute)}
.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Untere Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button{border:0;background:none;border-radius:0;min-height:58px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);min-width:0;position:relative}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--ink)}
.tabbar button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* Wochennavigation und Tagesleiste */
.nav{display:flex;align-items:center;gap:8px}
.nav #wk{flex:1;text-align:center;font-weight:600;min-width:0}
#strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;min-width:0;border-bottom:3px solid var(--line)}
.day.now{border-bottom-color:var(--ink)}
.day.gym{border-bottom-color:var(--gym)}.day.swim{border-bottom-color:var(--swim)}.day.run{border-bottom-color:var(--run)}.day.rest{border-bottom-color:var(--rest)}.day.flex{border-bottom-style:dashed}
.day.on{background:var(--ink);color:var(--bg)}
.day b{font-size:14px}
.day span{font-size:12px;color:var(--mute);white-space:nowrap}
.day span.ico{font-size:17px;line-height:1.25;color:inherit}
.day span.ico.opt{opacity:.45}
.day span.q{font-size:14px;font-weight:700}
.day.on span{color:var(--bg)}
.day span.full{color:var(--good);font-weight:650}
.day i{width:6px;height:6px;border-radius:50%;display:block}
.day i.dot{background:currentColor}

/* Gewohnheiten */
.gebet{--c:var(--gebet)}.bibel{--c:var(--bibel)}.kirche{--c:var(--kirche)}.spanisch{--c:var(--spanisch)}.python{--c:var(--python)}
.habits{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:8px}
.hb{display:grid;gap:3px;justify-items:start;align-content:start;text-align:left;padding:10px 12px;border-radius:12px;min-height:72px;min-width:0}
.hb .e{font-size:20px;line-height:1.1}
.hb b{font-size:15px}
.hb small{font-size:12px;color:var(--mute);line-height:1.25}
.hb.plan{border:1.5px dashed var(--c)}
.hb.on{background:var(--c);border:1.5px solid var(--c);color:var(--on)}
.hb.on small{color:var(--on)}
table.hg{width:100%;border-collapse:collapse;table-layout:fixed}.hg col.c0{width:112px}.hg col.c9{width:44px}
.hg th,.hg td{padding:3px 2px;text-align:center}
.hg thead th{font-size:12px;color:var(--mute);font-weight:600}
.hg thead th.now{color:var(--ink)}
.hg tbody th{text-align:left;font-weight:600;font-size:14px;white-space:nowrap;padding-right:6px}
.hg td.cnt{font-size:14px;color:var(--mute);white-space:nowrap;padding-left:6px;text-align:right}
.hg td.cnt.full{color:var(--good);font-weight:650}
.cell{width:100%;max-width:38px;height:34px;min-height:34px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--soft)}
.cell.plan{background:var(--card);border:1.5px dashed var(--c)}
.cell.miss{background:var(--card);border:1.5px solid var(--c);opacity:.55}
.cell.on{background:var(--c);border-color:var(--c)}
.cell.auto{background:color-mix(in srgb,var(--c) 55%,var(--card));border-color:var(--c)}
.lk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--soft);text-decoration:none;min-height:44px;min-width:0}
.lk .pl{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:50%;background:var(--c);color:var(--on);font-size:12px}
.lk b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.lk small{display:block;font-size:12px;color:var(--mute)}
.lkw{grid-column:2/-1;display:grid;gap:6px}
.pln{font-size:13px;color:var(--mute);line-height:1.4}
.lk.plain{background:none;border:1px dashed var(--line)}
.lk.plain .pl{background:none;color:inherit;font-size:17px}
.hbw{position:relative;display:grid;min-width:0}
.hbw .hb{padding-right:40px}
.hbi{position:absolute;top:5px;right:5px;width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;display:grid;place-items:center;font:italic 700 15px/1 Georgia,"Times New Roman",serif;background:var(--card);border:1px solid var(--line);color:var(--mute)}
.hbi[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hinf{display:grid;gap:6px;padding:10px;border-radius:12px;border:1.5px solid var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.legend .l-on{background:var(--kirche)}.legend .l-plan{border:1.5px dashed var(--kirche)}.legend .l-miss{border:1.5px solid var(--kirche);opacity:.55}

/* Heute: Termine, To-dos */
.te{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.te button{display:grid;gap:4px;justify-items:start;text-align:left;padding:10px 12px;border-radius:12px;min-width:0}
.te button b{font-size:15px}
.te button small{font-size:13px;color:var(--mute);line-height:1.3;overflow-wrap:anywhere}
.ev{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0;padding-top:0}
.ev time{font-size:14px;color:var(--mute);white-space:nowrap}
.ev .t{min-width:0;overflow-wrap:anywhere}
.ev.quiet .t{color:var(--mute)}
.ev.bday .t{font-weight:650}
.evday{font-size:13px;font-weight:600;color:var(--mute);margin-top:6px}
.td{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.td:first-child{border-top:0;padding-top:0}
.ck{width:28px;height:28px;min-height:28px;padding:0;border-radius:8px;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:15px;line-height:1}
.ck.on{background:var(--good);border-color:var(--good);color:var(--on)}
.ck.round{border-radius:50%}
.td .t{min-width:0;overflow-wrap:anywhere;border:0;background:none;padding:2px 0;min-height:28px;text-align:left;display:grid;gap:1px;border-radius:6px}
.td.done .t b{text-decoration:line-through;color:var(--mute);font-weight:500}
.td .t b{font-weight:600;display:block}
.td .t small{font-size:13px;color:var(--mute)}
.td .t small .late{color:var(--bad);font-weight:600}
.tdedit{grid-column:1/-1;display:grid;gap:8px;background:var(--soft);border-radius:10px;padding:10px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.addmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.addmeta input{width:auto}
details.more summary{cursor:pointer;color:var(--mute);font-size:14px;padding:4px 0}
details.more[open] summary{margin-bottom:6px}

/* Berichte */
details.rep summary{cursor:pointer;display:grid;gap:2px;list-style:none;position:relative;padding-right:22px}
details.rep summary::-webkit-details-marker{display:none}
details.rep summary::after{content:'+';position:absolute;right:0;top:0;color:var(--mute);font-weight:700}
details.rep[open] summary::after{content:'–'}
details.rep summary small{color:var(--mute);font-size:13px}
.md{display:grid;gap:8px;font-size:15px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.md h3{margin-top:6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.md p{margin:0}
.md ul{margin:0;padding-left:20px;display:grid;gap:4px}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:15px;line-height:1.5;overflow-wrap:anywhere}

/* Training */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:8px 2px;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.on.gym{background:var(--gym);border-color:var(--gym);color:var(--on)}
.seg button.on.run{background:var(--run);border-color:var(--run);color:var(--on)}
.seg button.on.swim{background:var(--swim);border-color:var(--swim);color:var(--on)}
.seg button.on.rest{background:var(--rest);border-color:var(--rest);color:var(--on)}
.time{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.time em{font-style:normal;color:var(--mute)}
.delta{font-size:14px;margin:0}
.delta.good{color:var(--good)}.delta.bad{color:var(--bad)}
.ex{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:52px 1fr auto 1fr;gap:8px;align-items:center}
.set span,.set em{color:var(--mute);font-size:14px;font-style:normal}
.prev{margin:0;color:var(--mute);font-size:14px}
.addx{width:100%;border-style:dashed}
.feel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.feel button{flex:1;min-width:40px}
.feel button.on{background:var(--ink);color:var(--bg)}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:110px}
.b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute);min-width:0}
.b i{width:100%;border-radius:4px 4px 0 0;display:block}


/* Einkauf */
.shop{display:grid}
.si{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.si:first-child{border-top:0}
.si .t{min-width:0;overflow-wrap:anywhere;font-size:16px}
.si.done .t{text-decoration:line-through;color:var(--mute)}
.si .ic{min-height:34px;padding:0 10px;border-color:transparent;background:none;color:var(--mute)}

/* Gebet: Ampel */
.s-open{--c:var(--l-open)}.s-no{--c:var(--l-no)}.s-part{--c:var(--l-part)}.s-yes{--c:var(--l-yes)}.s-more{--c:var(--l-more)}
.lamp{display:block;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 22%,var(--glass)),color-mix(in srgb,var(--c) 10%,var(--glass)) 70%);box-shadow:inset 0 1px 4px rgba(0,0,0,.25)}
.lamp.lit{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 45%,#fff),var(--c) 58%,color-mix(in srgb,var(--c) 75%,#000));box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
.signal{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sig{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;border-radius:12px;padding:6px 2px;min-width:0}
.sig .lamp{width:34px;height:34px}
.sig b{font-size:18px;font-weight:750;line-height:1}
.sig span{font-size:11px;color:var(--mute);text-align:center;line-height:1.2}
.sig[aria-pressed="true"]{background:var(--soft)}
.sig[aria-pressed="true"] span{color:var(--ink)}
.qrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qrow .lamp{width:20px;height:20px}
.qval{font-size:42px;line-height:.95;font-weight:800;color:var(--c);letter-spacing:-.02em}
.s-open .qval{color:var(--mute)}
.qval small{font-size:20px;font-weight:700;margin-left:2px}
.qcount{margin-left:auto;text-align:right;font-size:13px;line-height:1.35;color:var(--mute)}
.qcount strong{color:var(--ink)}
.gauge{position:relative;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.gauge i{position:absolute;top:0;bottom:0}
.gauge .g-base{left:0;background:var(--c)}
.s-more .gauge .g-base{background:var(--l-yes)}
.gauge .g-more{left:66.6667%;background:var(--l-more)}
.gauge .g-mark{left:66.6667%;width:2px;margin-left:-1px;background:var(--ink);opacity:.6}
.scale{position:relative;height:14px;font-size:11px;color:var(--mute)}
.scale span{position:absolute;top:0;transform:translateX(-50%)}
.scale span:first-child{transform:none}.scale span:last-child{transform:translateX(-100%)}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

<script>
/* ================= Grundbausteine ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>addD(d,-((d.getDay()+6)%7));
const kw=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[’' ]/g,'').replace(',','.'));return isFinite(n)?n:0};
const dec=(n,k=1)=>String(Math.round(n*Math.pow(10,k))/Math.pow(10,k)).replace('.',',');
const fmtD=s=>{const d=parse(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'};
const fmtDate=s=>{if(!s)return '';const[y,m,d]=s.split('-');return d+'.'+m+'.'+y};
const fmtSec=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s)};
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>iso(new Date());
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const has=v=>String(v==null?'':v).trim()!=='';
function money(n,dig){dig=dig||0;try{return n.toLocaleString('de-CH',{minimumFractionDigits:dig,maximumFractionDigits:dig})}catch(e){return n.toFixed(dig)}}
function readLS(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}

const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];

];
/* Empfehlung pro Wochentag: So Laufen, Mo + Mi Schwimmen, Di/Do/Sa Gym, Fr frei */

const TN={gym:'Gym',swim:'Schwimmen',run:'Laufen',rest:'Ruhetag',free:'Frei'};

/* Gym-Vorlagen. Maßgeblich ist settings/vorlagen in der Datenbank, das hier gilt nur bis sie geladen ist. */
const TPL0={order:['1','2','3'],t:{
  '1':{n:'Tag 1',ex:[{n:'Power Clean',s:3,w:'80',r:'5'},{n:'Kniebeugen',s:3,w:'120',r:'8'},{n:'Klimmzüge',s:3,w:'0',r:'8'},{n:'Leg Curl',s:3,w:'52,5',r:'8'},{n:'Bizeps/Trizeps',s:3,w:'35',r:'10'}]},
  '2':{n:'Tag 2',ex:[{n:'Pogo Jumps',s:3,w:'12',r:'15'},{n:'Military Press',s:4,w:'38',r:'5'},{n:'Kreuzheben',s:3,w:'130',r:'8'},{n:'Bankdrücken',s:3,w:'80',r:'8'},{n:'Wood Chopper',s:3,w:'15',r:'12'}]},
  '3':{n:'Tag 3',ex:[{n:'Power Clean / Clean High Pull',s:3,w:'90',r:'5'},{n:'Barbell Rows',s:3,w:'100',r:'5-8'},{n:'Dips',s:3,w:'10',r:'5-8'},{n:'Romanian Deadlift',s:3,w:'95',r:'5-8'},{n:'Side Bends',s:3,w:'24',r:'10'},{n:'Lateral Raises',s:3,w:'16',r:'15'},{n:'Neck Lateral Flexion (links + rechts)',s:3,w:'20',r:'15'}]}
}};

/* ================= Speicher =================
   Jede Sammlung hat einen Stand aus der Datenbank (base) und noch nicht gespeicherte Änderungen (pend).
   Änderungen bleiben im Browser erhalten, bis die Datenbank sie bestätigt hat, und überleben ein Neuladen. */
let DB=null,MODE='loading',lastErr='';
const STORES={};
function mkStore(name,o){
  o=o||{};
  const LK='th:'+name,c=readLS(LK)||{};
  const S={name,base:c.base||{},pend:c.pend||{},gone:c.gone||{},ver:{},timers:{},busy:{},ready:false,empty:o.empty||null,arr:o.arr||[],blank:o.blank||(()=>({}))};
  S.save=()=>writeLS(LK,{base:S.base,pend:S.pend,gone:S.gone});
  S.get=id=>Object.prototype.hasOwnProperty.call(S.pend,id)?(S.pend[id]||undefined):S.base[id];
  S.ids=()=>[...new Set([...Object.keys(S.base),...Object.keys(S.pend)])].filter(id=>S.get(id));
  S.all=()=>S.ids().map(id=>[id,S.get(id)]);
  S.edit=id=>{let x=S.pend[id];if(!x){x=Object.assign(S.blank(),clone(S.base[id]||{}));S.pend[id]=x}return x};
  S.touch=(id,delay)=>{S.ver[id]=(S.ver[id]||0)+1;S.save();schedule(S,id,delay)};
  S.put=(id,doc,delay)=>{S.pend[id]=doc;S.touch(id,delay)};

function errMsg(e){

  if(c==='revoked')return 'Bitte melde dich neu an.';
  if(c==='invalid_argument')return 'Ein Eintrag konnte nicht gespeichert werden.';

}
async function flush(S,id){
  clearTimeout(S.timers[id]);delete S.timers[id];
  if(!DB||!Object.prototype.hasOwnProperty.call(S.pend,id))return;
  if(S.busy[id]){S.again=S.again||{};S.again[id]=true;return}
  const v=S.ver[id]||0,doc=S.pend[id],body=doc?clone(doc):null;
  S.busy[id]=true;
  let ok=false,code='';
  try{
    const ref=DB.collection(S.name).doc(id);
    if(!body||(S.empty&&S.empty(body)))await ref.delete();else await ref.set(body);
    ok=true;lastErr='';
  }catch(e){code=e&&e.code;lastErr=errMsg(e)}
  S.busy[id]=false;
  if(ok&&(S.ver[id]||0)===v){
    delete S.pend[id];delete S.gone[id];
    if(!body||(S.empty&&S.empty(body)))delete S.base[id];else S.base[id]=body;
  }
  S.save();
  if(!ok&&['unavailable','resource_exhausted',undefined,''].includes(code||''))S.timers[id]=setTimeout(()=>flush(S,id),2500);
  if(S.again&&S.again[id]){S.again[id]=false;flush(S,id);return}
  if(ok&&Object.prototype.hasOwnProperty.call(S.pend,id)&&!S.timers[id])schedule(S,id,300);
  setSync();
}
function mergeFirst(S,id,loc,rem){
  if(!loc||!rem||!S.arr.length)return loc;
  const gone=new Set(S.gone[id]||[]);
  S.arr.forEach(f=>{
    const mine=loc[f]||[],ids=new Set(mine.map(x=>x&&x.id));
    loc[f]=mine.concat((rem[f]||[]).filter(x=>x&&x.id&&!ids.has(x.id)&&!gone.has(x.id)));
  });
  return loc;
}
function subscribe(S){
  DB.collection(S.name).onSnapshot(snap=>{
    if(snap.metadata.fromCache&&snap.empty&&Object.keys(S.base).length)return;
    const b={};snap.docs.forEach(d=>{if(d.exists)b[d.id]=clone(d.data())});
    const first=!S.ready;
    S.base=b;S.ready=true;
    if(first)Object.keys(S.pend).forEach(id=>{if(S.pend[id])S.pend[id]=mergeFirst(S,id,S.pend[id],b[id])});
    S.save();
    Object.keys(S.pend).forEach(id=>{if(!S.timers[id]&&!S.busy[id])schedule(S,id,first?200:600)});
    softRender();setSync();
  },e=>{
    if(e&&e.code==='revoked'){lastErr=errMsg(e);setSync();return}
    setTimeout(()=>subscribe(S),5000);
  });
}

  const k=key(name);if(!k)return null;

}

function setTrainType(v){
  const k=sel,before=sess(k)?clone(sess(k)):null,prevT=typeOf(k),x=sessions.edit(k);
  const hadData=before?(hasGym(before)||hasCardio(before)):false;
  if(v==='gx')return render();
  const clearCardio=()=>{x.dist='';x.min='';x.sec='';x.laps=''};
  if(v[0]==='g'){
    const id=v.slice(1);x.type='gym';
    if((x.tpl||inferTpl(x))!==id||!(x.ex||[]).length){x.ex=tplEx(id).map(e=>({n:e.n,sets:[...Array(Math.max(1,num(e.s)||3))].map(()=>({w:'',r:''}))}))}
    x.tpl=id;clearCardio();
  }else{
    x.type=v;x.tpl='';x.ex=[];
    if(v!==prevT)clearCardio();
    if(v===''){x.feel=0;x.note=''}
  }
  sessions.touch(k,0);
  if(hadData&&v!==(prevT==='gym'?'g'+(before.tpl||inferTpl(before)):prevT))toast('Einheit geändert',()=>{if(before)sessions.put(k,before,0);render()});

}

/* ================= Geld =================
   Budgetmonat = 25. bis 24. des Folgemonats (Gehalt am 25.).
   Frei = Netto − Fixkosten − Sparplan − Monatsausgaben.
   Wochenbudget = (Frei − Wochenausgaben vor dieser Woche) × Tage dieser Woche im Budgetmonat ÷ verbleibende Tage ab Wochenbeginn.
   Was in einer Woche übrig bleibt, verteilt sich so automatisch auf die restlichen Wochen. */
const rate=()=>num((SET()||{}).rate)||0.93;
const chf=x=>x.cur==='EUR'?num(x.a)*rate():num(x.a);
const spentDay=k=>(((days.get(k)||{}).sp)||[]).reduce((a,x)=>a+chf(x),0);
const addMon=(ym,i)=>{const[y,m]=ym.split('-').map(Number),d=new Date(y,m-1+i,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const perKey=k=>{const d=parse(k);let y=d.getFullYear(),m=d.getMonth();if(d.getDate()<25){m--;if(m<0){m=11;y--}}return y+'-'+pad(m+1)};
const perStart=pk=>pk+'-25';
const perEnd=pk=>iso(addD(parse(addMon(pk,1)+'-25'),-1));
const perLabel=pk=>fmtD(perStart(pk))+'–'+fmtD(perEnd(pk));
const shiftMonth=(k,n)=>{const d=parse(k),y=d.getFullYear(),m=d.getMonth()+n,dim=new Date(y,m+1,0).getDate();return iso(new Date(y,m,Math.min(d.getDate(),dim)))};
/* Monatsausgaben liegen in „extra“: {n, a, cur, m = Budgetmonat, k = Anzahl Monate (alt, meist 1)} */
const exK=x=>Math.max(1,Math.round(num(x.k))||1);
const exIn=(x,pk)=>{if(!x||!x.m)return false;const k=exK(x);for(let i=0;i<k;i++)if(addMon(x.m,i)===pk)return true;return false};
const exShare=x=>chf(x)/exK(x);
const exList=pk=>extra.all().filter(([,x])=>exIn(x,pk)).sort((a,b)=>String(b[1].created||'').localeCompare(String(a[1].created||'')));
const exSum=pk=>exList(pk).reduce((a,[,x])=>a+exShare(x),0);
const r2=v=>Math.round(v*100)/100;
const fxHasA=f=>f&&f.a!=null&&String(f.a).trim()!=='';
const fxMon=f=>fxHasA(f)?num(f.a)*(f.cur==='EUR'?rate():1)/(f.per==='j'?12:1):num(f.chf);
function fixTotal(s){s=s||SET()||{};return Array.isArray(s.fixList)?s.fixList.reduce((a,f)=>a+fxMon(f),0):num(s.fix)}
/* Netto des Budgetmonats; fehlt es, gilt der letzte eingetragene Wert */
function netOf(pk){
  const s=SET()||{},nb=s.netby||{};
  if(has(nb[pk]))return {v:num(nb[pk]),own:true};
  const ks=Object.keys(nb).filter(x=>x<pk&&has(nb[x])).sort();
  return {v:ks.length?num(nb[ks[ks.length-1]]):num(s.net),own:false};
}
function spentRange(a,b){let s=0;if(a>b)return 0;days.ids().forEach(k=>{if(k>=a&&k<=b)s+=spentDay(k)});return s}
function budget(k){
  k=k||sel;
  const s=SET()||{},pk=perKey(k),ps=perStart(pk),pe=perEnd(pk),N=netOf(pk);
  const net=N.v,fix=fixTotal(s),save=s.save==null||s.save===''?30:num(s.save),sp=net*save/100,mon=exSum(pk),free=net-fix-sp-mon;
  const wk=weekDays(),ws=wk[0]>ps?wk[0]:ps,we=wk[6]<pe?wk[6]:pe;
  const before=spentRange(ps,iso(addD(parse(ws),-1))),weekSpent=spentRange(ws,we),monthSpent=spentRange(ps,pe);
  const D=daysBetween(ws,pe)+1,dw=daysBetween(ws,we)+1,week=(free-before)*dw/D;
  return {pk,ps,pe,net,own:N.own,fix,save,sp,mon,free,ws,we,week,weekSpent,weekLeft:week-weekSpent,monthSpent,monthLeft:free-monthSpent,has:net>0};
}
const chfS=v=>(v<0?'−':'')+money(Math.abs(v));
function calcOut(B){
  return '<div class="calc"><div><span>− Fixkosten</span><span>'+money(B.fix)+' CHF</span></div><div><span>− Sparplan '+money(B.save)+' %</span><span>'+money(B.sp)+' CHF</span></div><div><span>− Monatsausgaben</span><span>'+money(B.mon)+' CHF</span></div><div class="tot"><span>Frei im Monat</span><span>'+chfS(B.free)+' CHF</span></div></div>'
    +'<div class="bres"><div class="stat'+(B.weekLeft<0?' neg':'')+'"><small>Woche noch</small><b>'+chfS(B.weekLeft)+'</b><small>von '+chfS(B.week)+' CHF</small></div><div class="stat'+(B.monthLeft<0?' neg':'')+'"><small>Monat noch</small><b>'+chfS(B.monthLeft)+'</b><small>von '+chfS(B.free)+' CHF</small></div></div>';

    case 'tdclose':tdOpen='';tdConfirm='';return render();
    case 'tdpr':{const x=todos.edit(b.dataset.id);x.pr=b.dataset.v;todos.touch(b.dataset.id,0);return render()}
    case 'tddel':tdConfirm=b.dataset.id;return render();
    case 'tddelno':tdConfirm='';return render();
    case 'tddelyes':{const id=b.dataset.id,x=clone(todos.get(id));todos.del(id);tdOpen='';tdConfirm='';toast('To-do gelöscht',()=>{todos.put(id,x,0);render()});return render()}
    case 'toGeld':geldR='woche';setView('geld');{const i=$('#amt');if(i){i.focus();i.scrollIntoView({block:'center'})}}return;
    case 'jnext':return jobNext();
    case 'jobst':{const x=jobs.edit(b.dataset.id);x.st=x.st===b.dataset.v?'Neu':b.dataset.v;jobs.touch(b.dataset.id,0);return render()}
    case 'cur':{const ai=$('#amt');if(ai)gAmt=ai.value;const ni=$('#gnote');if(ni)gNote=ni.value;gCur=b.dataset.v;try{localStorage.setItem('th-cur',gCur)}catch(err){}return render()}
    case 'delsp':return delSpend(b.dataset.k,+b.dataset.i);
    case 'exrm':return delMonthly(b.dataset.id);
    case 'rng':geldR=b.dataset.v==='monat'?'monat':'woche';try{localStorage.setItem('th-geld',geldR)}catch(err){}return render();
    case 'kopen':return fxOpen(+b.dataset.i);
    case 'knew':fxEdit={i:-1,n:'',a:'',cur:'CHF',per:'m',bis:''};fxConfirm=false;render();{const el=$('#fxn');if(el)el.focus()}return;
    case 'kcur':if(fxEdit)fxEdit.cur=b.dataset.v;return render();
    case 'kper':if(fxEdit)fxEdit.per=b.dataset.v;return render();
    case 'ksave':return fxSave();
    case 'kcancel':fxEdit=null;fxConfirm=false;return render();
    case 'kdel':fxConfirm=true;return render();
    case 'kdelyes':return fxDelete();
  }
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='tsel')setTrainType(e.target.value)});
document.addEventListener('toggle',e=>{
  const id=e.target&&e.target.id;
  if(id==='repw'||id==='repm'){repOpen=e.target.open;try{localStorage.setItem('th-rep',repOpen?'1':'0')}catch(err){}}
  if(id==='tdlater')tdLaterOpen=e.target.open;
  if(id==='calup')calUpOpen=e.target.open;
  if(id==='ginfo')gInfo=e.target.open;
  if(id==='verlauf')verlaufOpen=e.target.open;
  if(id==='fxbox')fxBoxOpen=e.target.open;
},true);
document.addEventListener('submit',e=>{
  const id=e.target.id;
  if(id==='tdform'){e.preventDefault();addTodo()}
  if(id==='shopform'){e.preventDefault();addShop()}
  if(id==='geldform'){e.preventDefault();addGeld()}
  if(id==='gform'){
    e.preventDefault();
    const text=($('#gtext').value||'').trim();if(!text){$('#gtext').focus();return}
    const date=$('#gdate').value||today();
    prayers.put('p'+uid(),{text,date,status:'open',changed:date,hist:[{s:'open',d:date}],note:'',created:Date.now()},0);
    if(gFilter!=='all'&&gFilter!=='open')gFilter='all';
    gClose();toast('Gebet eingetragen');
  }
});
document.addEventListener('keydown',e=>{
  const id=e.target&&e.target.id;
  if(e.key==='Enter'&&id==='amt'){e.preventDefault();addGeld()}
  if(e.key==='Enter'&&(id==='fxn'||id==='fxa')){e.preventDefault();fxSave()}
  if(e.key==='Enter'&&id&&id.startsWith('se_')){e.preventDefault();shopEditId='';render()}
  if(e.key==='Escape'&&gSheet)gClose();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.tf)return trainInput(t);
  if(t.dataset.td){
    const id=t.dataset.id,f=t.dataset.td,x=todos.edit(id);
    if(f==='t'&&!t.value.trim())return;
    x[f]=f==='t'?t.value.trim():t.value;todos.touch(id,800);return;
  }
  const f=t.dataset.in;if(!f)return;
  if(f==='td')tdDraft=t.value;
  else if(f==='shop')shopDraft=t.value;
  else if(f==='shopedit'){const v=t.value.trim();if(!v)return;const x=shop.edit(t.dataset.id);x.t=v;shop.touch(t.dataset.id,800)}
  else if(f==='amt')gAmt=t.value;
  else if(f==='gnote')gNote=t.value;
  else if((f==='fxn'||f==='fxa'||f==='fxbis')&&fxEdit)fxEdit[f.slice(2)]=t.value;
  else if(f==='gf'&&gSheet&&gSheet!=='new'){const fl=t.dataset.f;if(fl==='text'&&!t.value.trim())return;const x=prayers.edit(gSheet);x[fl]=fl==='text'?t.value.trim():t.value;prayers.touch(gSheet,900)}
  else if(f==='net'||f==='save'){
    const s=settings.edit('budget'),v=t.value.trim();
    if(f==='save')s.save=v===''?null:num(v);
    else{const pk=perKey(sel);s.netby=Object.assign({},s.netby||{});if(v===''){delete s.netby[pk]}else{s.netby[pk]=num(v);if(pk>=perKey(today()))s.net=num(v)}}
    settings.touch('budget',700);const c=$('#calcout');if(c)c.innerHTML=calcOut(budget());
  }
});
document.addEventListener('focusout',e=>{
  const id=e.target&&e.target.id;
  if(id==='net'||id==='save')setTimeout(render,0);
  if(id&&id.startsWith('se_'))setTimeout(()=>{if(shopEditId&&!(document.activeElement&&document.activeElement.id==='se_'+shopEditId)){shopEditId='';render()}},150);
});
/* ================= Einstellungen ================= */
function setHTML(){
  const k=settings.get('kalender')||{};
  return '<div class="head"><h2 id="setTitle">Einstellungen</h2><button data-s="close">Fertig</button></div>'
    +(window.jamesSettings?jamesSettings():'')+'<section class="card"><h3>Kalender</h3><p class="hint">Damit deine Termine erscheinen: In Google Kalender am Computer unter Einstellungen → dein Kalender → „Privatadresse im iCal-Format“ den Link kopieren und hier einfügen.</p>'
    +'<input id="icsin" type="url" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics" value="'+esc(k.ics||'')+'" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="row"><button class="pri" data-s="ics">Speichern</button>'+(k.ics?'<button class="danger" data-s="icsdel">Entfernen</button>':'')+'</div></section>'
    +'<section class="card"><h3>Daten</h3><p class="hint">Alles liegt auf deinem eigenen Server und ist zusätzlich auf diesem Gerät gespeichert. '+esc($('#sync').textContent)+'</p><div class="row"><button data-s="sync">Jetzt synchronisieren</button><button data-s="export">Sicherung herunterladen</button></div></section>'
    +'<section class="card"><h3>Gerät</h3><p class="hint">Auf dem iPhone oder iPad: In Safari auf „Teilen“ → „Zum Home-Bildschirm“, dann startet das Tagesheft wie eine App.</p><div class="row"><button class="danger" data-s="logout">Auf diesem Gerät abmelden</button></div></section>';
}
function setOpen(){$('#setsheet').innerHTML=setHTML();$('#setov').hidden=false;document.body.classList.add('lock')}
function setClose(){$('#setov').hidden=true;$('#setsheet').innerHTML='';document.body.classList.remove('lock')}
document.addEventListener('click',e=>{
  if(e.target.closest('#setbtn'))return setOpen();
  if(e.target.id==='setclose')return setClose();
  const b=e.target.closest('[data-s]');if(!b)return;
  const a=b.dataset.s;
  if(a==='close')return setClose();
  if(a==='ics'){
    const v=($('#icsin').value||'').trim();
    if(!/^(https|webcal):\/\/\S+$/.test(v)){toast('Das ist kein gültiger Link.');return}
    settings.put('kalender',{ics:v,at:new Date().toISOString()},0);
    Object.keys(CAL).forEach(k=>delete CAL[k]);calW.k='';upW.k='';
    setTimeout(()=>{watchCal();softRender()},1500);
    toast('Kalender gespeichert');setClose();return;
  }
  if(a==='icsdel'){settings.del('kalender');Object.keys(CAL).forEach(k=>delete CAL[k]);calW.k='';upW.k='';setTimeout(()=>{watchCal();softRender()},1500);toast('Kalender entfernt');setClose();return}
  if(a==='sync'){TH.pull();toast('Synchronisiere …');return}
  if(a==='export')return TH.exportAll();
  if(a==='logout'){if(confirm('Auf diesem Gerät abmelden? Deine Daten bleiben auf dem Server.'))TH.logout();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#setov').hidden)setClose()});
window.addEventListener('th-synced',e=>{if(!e.detail.ok&&e.detail.code==='unavailable'){lastErr=errMsg({code:'unavailable'});setSync()}else if(e.detail.ok&&lastErr&&/nachgetragen/.test(lastErr)){const open=ALL.reduce((n,S)=>n+Object.keys(S.pend).length,0);if(!open){lastErr='';setSync()}}});
if(window.jamesInit)jamesInit();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
